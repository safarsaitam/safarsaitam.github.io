<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="./css/layout.css">
    <script src="./js/index.js" defer></script>
    <title>Dissonâncias</title>
</head>
<body>
    <div class="lang-box">
        <p data-lang="pt" onclick="setLanguage('pt')">pt</p>
        <span class="sep">|</span>
        <p data-lang="en" onclick="setLanguage('en')">en</p>
    </div>
    <div class="title-container">
        <h1>Dissonâncias</h1>
        <h3 data-i18n="site-description">Pensamentos e desabafos contraditórios de alguém mais do que ninguém que só deseja o bem.</h3>
        <hr>
    </div>
    <div id="contact-box">

        <button id="close-contact-box">×</button>

        <p id="first-question" data-i18n="contact-question">
            Queres saber quando se deu a última dissonância?
        </p>

        <form
            action="https://formspree.io/f/meenbado"
            method="POST"
        >
            <div id="the-inputs">
                <input
                    type="email"
                    name="email"
                    placeholder="Inserir e-mail"
                    data-i18n-placeholder="email-placeholder"
                    required
                >

                <button type="submit" data-i18n="submit-button">
                    Enviar
                </button>
            </div>

            
        </form>

        <hr>

        <p data-i18n="contact-invitation">
            Queres ser humano comigo?
        </p>

        <a href="mailto:dissonanciasdissonancias@gmail.com">
            dissonanciasdissonancias@gmail.com
        </a>
    </div>
    <script src="js/render.js"></script>
    </body>
</html>
